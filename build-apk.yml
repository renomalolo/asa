name: Kompilasi APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi (versi cocok dengan SDK Expo)
        run: |
          npm install expo@latest --legacy-peer-deps
          npx expo install react react-native expo-audio expo-speech expo-location expo-file-system expo-asset \
            expo-notifications expo-sensors expo-clipboard expo-document-picker expo-intent-launcher \
            @react-native-async-storage/async-storage
          npm install react-native-volume-manager react-native-background-actions --legacy-peer-deps

      - name: Buat folder android (prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Kompilasi APK Android
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JadwalSalat-apk
          path: android/app/build/outputs/apk/release/*.apk
